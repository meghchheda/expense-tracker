<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Megh's Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --saffron:        #E8700A;
      --saffron-hover:  #C95E06;
      --saffron-light:  #FFF4E8;
      --saffron-mid:    #F5A050;
      --ink:            #1A1208;
      --ink-mid:        #4A3820;
      --ink-light:      #8C7A60;
      --surface:        #FEFAF5;
      --surface-2:      #F7F0E6;
      --surface-3:      #EDE0CC;
      --success:        #1D9E75;
      --success-bg:     #E1F5EE;
      --danger:         #D85A30;
      --danger-bg:      #FAECE7;
      --border-r:       10px;
    }

    html, body {
      height: 100%;
      background: var(--surface);
      font-family: 'Sora', sans-serif;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--surface-3);
      border-right: 1px solid var(--surface-3);
    }

    /* ── Header ── */
    .header {
      padding: 28px 32px 22px;
      border-bottom: 1px solid var(--surface-3);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 34px;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .header h1 span { color: var(--saffron); font-style: italic; }
    .header-sub {
      font-size: 11px;
      color: var(--ink-light);
      margin-top: 5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .header-date {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--ink-light);
      text-align: right;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      gap: 3px;
      padding: 10px 32px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--surface-3);
    }
    .nav-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: 'Sora', sans-serif;
      color: var(--ink-mid);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s, color 0.15s;
      font-weight: 400;
    }
    .nav-btn i { font-size: 16px; }
    .nav-btn.active { background: var(--saffron); color: #fff; font-weight: 500; }
    .nav-btn:not(.active):hover { background: var(--surface-3); color: var(--ink); }

    /* ── Content ── */
    .content { padding: 28px 32px; flex: 1; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Stat cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--border-r);
      padding: 18px;
    }
    .stat-card.accent {
      background: var(--saffron);
      border-color: var(--saffron);
    }
    .stat-card .s-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-light);
      margin-bottom: 10px;
      font-weight: 500;
    }
    .stat-card.accent .s-label { color: rgba(255,255,255,0.75); }
    .stat-card .s-value {
      font-family: 'DM Mono', monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1;
    }
    .stat-card.accent .s-value { color: #fff; }
    .stat-card .s-sub {
      font-size: 11px;
      color: var(--ink-light);
      margin-top: 6px;
    }
    .stat-card.accent .s-sub { color: rgba(255,255,255,0.7); }

    /* ── Section title ── */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-light);
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Bar chart ── */
    .chart-section { margin-bottom: 30px; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .bar-cat {
      font-size: 12px;
      color: var(--ink-mid);
      width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      background: var(--surface-3);
      border-radius: 4px;
      height: 9px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--saffron);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bar-amt {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--ink-mid);
      width: 100px;
      text-align: right;
    }

    /* ── Expense rows ── */
    .expense-list { display: flex; flex-direction: column; gap: 7px; }
    .expense-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: 9px;
      padding: 12px 16px;
      transition: border-color 0.15s, background 0.15s;
    }
    .expense-row:hover { border-color: var(--saffron-mid); background: var(--saffron-light); }
    .cat-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface-3);
      color: var(--ink-mid);
      white-space: nowrap;
      min-width: 88px;
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .row-desc { flex: 1; font-size: 13px; color: var(--ink-mid); }
    .row-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--ink-light);
      white-space: nowrap;
    }
    .row-amt {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      min-width: 90px;
      text-align: right;
    }
    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-light);
      padding: 5px;
      border-radius: 6px;
      font-size: 17px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .del-btn:hover { color: var(--danger); background: var(--danger-bg); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 52px 24px;
      color: var(--ink-light);
    }
    .empty-state i { font-size: 44px; display: block; margin-bottom: 14px; opacity: 0.35; }
    .empty-state p { font-size: 14px; }

    /* ── Filter row ── */
    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .filter-select {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-family: 'Sora', sans-serif;
      color: var(--ink-mid);
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .filter-select:focus { border-color: var(--saffron); }
    .filter-count {
      font-size: 12px;
      color: var(--ink-light);
      margin-left: auto;
      font-family: 'DM Mono', monospace;
    }

    /* ── Add Form ── */
    .add-form {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: 14px;
      padding: 26px;
      max-width: 560px;
    }
    .add-form h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      margin-bottom: 22px;
      color: var(--ink);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-light);
      font-weight: 500;
    }
    .form-group input {
      background: var(--surface);
      border: 1px solid var(--surface-3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(232, 112, 10, 0.12);
    }
    .form-group input::placeholder { color: var(--ink-light); }
    .form-actions { display: flex; justify-content: flex-end; margin-top: 22px; gap: 10px; }
    .btn-save {
      background: var(--saffron);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-save:hover { background: var(--saffron-hover); }
    .btn-save:active { transform: scale(0.98); }
    .btn-save i { font-size: 17px; }
    .btn-clear {
      background: transparent;
      color: var(--ink-light);
      border: 1px solid var(--surface-3);
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-clear:hover { background: var(--surface-3); color: var(--ink-mid); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--ink);
      color: #fff;
      padding: 11px 22px;
      border-radius: 9px;
      font-size: 13px;
      font-family: 'Sora', sans-serif;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--surface-3);
      border-top-color: var(--saffron);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .content { padding: 20px 18px; }
      .header, .nav { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div>
      <h1>Kha₹<span>cha</span></h1>
      <div class="header-sub">Personal Expense Tracker</div>
    </div>
    <div class="header-date" id="hdate"></div>
  </header>

  <!-- Nav -->
  <nav class="nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showPage('dashboard')">
      <i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard
    </button>
    <button class="nav-btn" id="nav-expenses" onclick="showPage('expenses')">
      <i class="ti ti-list" aria-hidden="true"></i> All Expenses
    </button>
    <button class="nav-btn" id="nav-add" onclick="showPage('add')">
      <i class="ti ti-plus" aria-hidden="true"></i> Add New
    </button>
  </nav>

  <!-- Pages -->
  <main class="content">

    <!-- DASHBOARD -->
    <section id="page-dashboard" class="page active" aria-label="Dashboard">
      <div class="summary-grid">
        <div class="stat-card accent">
          <div class="s-label">Total Spent</div>
          <div class="s-value" id="stat-total">₹0</div>
          <div class="s-sub" id="stat-count">0 entries</div>
        </div>
        <div class="stat-card">
          <div class="s-label">This Month</div>
          <div class="s-value" id="stat-month">₹0</div>
          <div class="s-sub" id="stat-month-label">—</div>
        </div>
        <div class="stat-card">
          <div class="s-label">Top Category</div>
          <div class="s-value" id="stat-top" style="font-size:15px;padding-top:5px;">—</div>
          <div class="s-sub" id="stat-top-amt"></div>
        </div>
      </div>

      <div class="chart-section">
        <div class="section-title">Spending by Category</div>
        <div id="chart-bars"></div>
      </div>

      <div>
        <div class="section-title">Recent Entries</div>
        <div class="expense-list" id="recent-list"></div>
      </div>
    </section>

    <!-- ALL EXPENSES -->
    <section id="page-expenses" class="page" aria-label="All Expenses">
      <div class="filter-row">
        <select class="filter-select" id="filter-cat" onchange="renderExpenses()">
          <option value="">All categories</option>
        </select>
        <span class="filter-count" id="filter-count"></span>
      </div>
      <div class="expense-list" id="all-list"></div>
    </section>

    <!-- ADD EXPENSE -->
    <section id="page-add" class="page" aria-label="Add Expense">
      <div class="add-form">
        <h2>New Expense</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="inp-date">Date</label>
            <input type="date" id="inp-date" />
          </div>
          <div class="form-group">
            <label for="inp-amount">Amount (₹)</label>
            <input type="number" id="inp-amount" placeholder="0.00" min="0.01" step="0.01" />
          </div>
          <div class="form-group">
            <label for="inp-cat">Category</label>
            <input type="text" id="inp-cat" placeholder="e.g. Food, Transport…" list="cat-datalist" autocomplete="off" />
            <datalist id="cat-datalist"></datalist>
          </div>
          <div class="form-group">
            <label for="inp-desc">Description</label>
            <input type="text" id="inp-desc" placeholder="Optional note" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-clear" onclick="clearForm()">Clear</button>
          <button class="btn-save" id="save-btn" onclick="addExpense()">
            <i class="ti ti-check" aria-hidden="true"></i> Save Expense
          </button>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const CURRENCY = '₹';
  let expenses = [];

  /* ── Utilities ── */
  function fmt(n) {
    return CURRENCY + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function todayISO() {
    return new Date().toISOString().split('T')[0];
  }

  function fmtDate(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr + 'T00:00:00');
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? 'var(--danger)' : 'var(--ink)';
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  const CAT_COLORS = ['#E8700A','#1D9E75','#378ADD','#D85A30','#7F77DD','#D4537E','#639922','#BA7517','#0F6E56','#993556'];
  function catColor(i) { return CAT_COLORS[i % CAT_COLORS.length]; }

  /* ── API calls ── */
  async function loadAll() {
    try {
      const res = await fetch('/api/expenses');
      if (!res.ok) throw new Error();
      expenses = await res.json();
    } catch {
      showToast('Could not load expenses.', true);
      expenses = [];
    }
    const active = document.querySelector('.page.active');
    if (active.id === 'page-dashboard') renderDashboard();
    if (active.id === 'page-expenses') renderExpenses();
  }

  async function addExpense() {
    const date        = document.getElementById('inp-date').value;
    const rawAmount   = document.getElementById('inp-amount').value;
    const category    = document.getElementById('inp-cat').value.trim() || 'Uncategorised';
    const description = document.getElementById('inp-desc').value.trim();
    const amount      = parseFloat(rawAmount);

    if (!date)                  { showToast('Please enter a date.', true); return; }
    if (!rawAmount || amount <= 0) { showToast('Enter a valid amount greater than 0.', true); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';

    try {
      const res = await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, amount, category, description })
      });
      if (!res.ok) throw new Error();
      showToast('✓ Expense saved!');
      clearForm();
      await loadAll();
    } catch {
      showToast('Failed to save. Please try again.', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Save Expense';
    }
  }

  async function deleteExpense(idx) {
    if (!confirm('Delete this expense?')) return;
    try {
      const res = await fetch(`/api/expenses/${idx}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      showToast('Expense deleted.');
      await loadAll();
    } catch {
      showToast('Failed to delete.', true);
    }
  }

  /* ── Render helpers ── */
  function expenseRowHTML(e, idx) {
    const desc = e.description ? e.description : '—';
    return `
      <div class="expense-row">
        <span class="cat-badge">${e.category || 'Uncategorised'}</span>
        <span class="row-desc">${desc}</span>
        <span class="row-date">${fmtDate(e.date)}</span>
        <span class="row-amt">${fmt(e.amount)}</span>
        <button class="del-btn" onclick="deleteExpense(${idx})" title="Delete expense" aria-label="Delete expense">
          <i class="ti ti-trash" aria-hidden="true"></i>
        </button>
      </div>`;
  }

  function renderDashboard() {
    const total = expenses.reduce((s, e) => s + Number(e.amount), 0);
    document.getElementById('stat-total').textContent  = fmt(total);
    document.getElementById('stat-count').textContent  = `${expenses.length} ${expenses.length === 1 ? 'entry' : 'entries'}`;

    const now      = new Date();
    const prefix   = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const monthly  = expenses.filter(e => (e.date || '').startsWith(prefix));
    const mTotal   = monthly.reduce((s, e) => s + Number(e.amount), 0);
    document.getElementById('stat-month').textContent      = fmt(mTotal);
    document.getElementById('stat-month-label').textContent = now.toLocaleString('default', { month: 'long', year: 'numeric' });

    const catMap = {};
    expenses.forEach(e => {
      const c = e.category || 'Uncategorised';
      catMap[c] = (catMap[c] || 0) + Number(e.amount);
    });
    const sorted = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

    if (sorted.length) {
      document.getElementById('stat-top').textContent     = sorted[0][0];
      document.getElementById('stat-top-amt').textContent = fmt(sorted[0][1]);
    } else {
      document.getElementById('stat-top').textContent     = '—';
      document.getElementById('stat-top-amt').textContent = '';
    }

    const barsEl = document.getElementById('chart-bars');
    if (!sorted.length) {
      barsEl.innerHTML = '<p style="font-size:13px;color:var(--ink-light);padding:12px 0;">No data yet — add your first expense.</p>';
    } else {
      const max = sorted[0][1];
      barsEl.innerHTML = sorted.slice(0, 8).map(([cat, amt], i) => `
        <div class="bar-row">
          <div class="bar-cat" title="${cat}">${cat}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt / max * 100)}%;background:${catColor(i)}"></div></div>
          <div class="bar-amt">${fmt(amt)}</div>
        </div>`).join('');
    }

    const recentEl = document.getElementById('recent-list');
    const recent   = [...expenses].reverse().slice(0, 5);
    if (!recent.length) {
      recentEl.innerHTML = '<div class="empty-state"><i class="ti ti-receipt" aria-hidden="true"></i><p>No expenses recorded yet.</p></div>';
    } else {
      recentEl.innerHTML = recent.map(e => {
        const origIdx = expenses.indexOf(e);
        return expenseRowHTML(e, origIdx);
      }).join('');
    }
  }

  function renderExpenses() {
    const sel  = document.getElementById('filter-cat');
    const cats = [...new Set(expenses.map(e => e.category || 'Uncategorised'))].sort();
    const prev = sel.value;
    sel.innerHTML = '<option value="">All categories</option>' +
      cats.map(c => `<option value="${c}"${c === prev ? ' selected' : ''}>${c}</option>`).join('');

    const filter   = sel.value;
    const filtered = filter ? expenses.filter(e => (e.category || 'Uncategorised') === filter) : expenses;
    document.getElementById('filter-count').textContent = `${filtered.length} entries`;

    const el = document.getElementById('all-list');
    if (!filtered.length) {
      el.innerHTML = '<div class="empty-state"><i class="ti ti-receipt" aria-hidden="true"></i><p>No expenses recorded yet.</p></div>';
    } else {
      el.innerHTML = [...filtered].reverse().map(e => {
        const origIdx = expenses.indexOf(e);
        return expenseRowHTML(e, origIdx);
      }).join('');
    }
  }

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');
    if (name === 'dashboard') renderDashboard();
    if (name === 'expenses')  renderExpenses();
    if (name === 'add') {
      if (!document.getElementById('inp-date').value) {
        document.getElementById('inp-date').value = todayISO();
      }
      populateCatSuggestions();
    }
  }

  function populateCatSuggestions() {
    const cats = [...new Set(expenses.map(e => e.category || 'Uncategorised'))];
    document.getElementById('cat-datalist').innerHTML = cats.map(c => `<option value="${c}">`).join('');
  }

  function clearForm() {
    document.getElementById('inp-date').value   = todayISO();
    document.getElementById('inp-amount').value = '';
    document.getElementById('inp-cat').value    = '';
    document.getElementById('inp-desc').value   = '';
  }

  /* ── Enter key on add form ── */
  ['inp-date','inp-amount','inp-cat','inp-desc'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') addExpense();
    });
  });

  /* ── Init ── */
  document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'short', day: 'numeric', month: 'long', year: 'numeric'
  });
  document.getElementById('inp-date').value = todayISO();

  loadAll();
</script>

</body>
</html>
